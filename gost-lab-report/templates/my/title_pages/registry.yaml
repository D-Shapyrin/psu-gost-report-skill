# Реестр титульников ПГУ (каф. ИБСТ) — личные бланки пользователя.
# id (ключ) = имя файла в этом каталоге без .docx; выбирается YAML-полем title_page.
# Механика подстановки генерическая: любой YAML-ключ отчёта доступен шаблону
# как {{KEY}} и {{KEY_UPPER}}; {{REPORT_TYPE}} и {{YEAR}} подставляются всегда.
# Специфика конкретного вуза (кегли, формы) живёт здесь, а не в общих правилах движка.

pgu_lab:
  university: "ПГУ"
  work_type: "лабораторная"
  fields: [lab_number, lab_title, discipline, group, student_name, grade, date_submitted, accepted_by, year]
  specifics: >-
    Бланк с личного шаблона «Шапырин лабораторная работа № .docx» (каф.
    «Информационная безопасность систем и технологий»): шапка «МИНИСТЕРСТВО …
    РФ / ПЕНЗЕНСКИЙ ГОСУДАРСТВЕННЫЙ УНИВЕРСИТЕТ / Кафедра …», далее «Отчет»,
    «о лабораторной работе № {{LAB_NUMBER}}», «на тему «{{LAB_TITLE}}»». Блок
    реквизитов (Дисциплина/Группа/Выполнил/Количество баллов/Дата сдачи/Принял)
    — слева, абзацы с отступом 4989 twips; значения дописываются после двоеточий
    в том же run'е, что и подпись. Год — отдельной центрированной строкой внизу.
    Титул заполняет страницу целиком (год стоит на нижней границе поля), поэтому
    body начинается со второй страницы сам — page break в конце НЕ ставить
    (иначе LibreOffice/Word уносит строку года на 2-ю страницу).

pgu_course:
  university: "ПГУ"
  work_type: "курсовая"
  fields: [discipline, topic, decimal_number, group, student_name, teacher_name, teacher_title, year]
  specifics: >-
    Официальный бланк КР каф. ИБСТ (из «Титульный лист КР БСБД 100503.doc»,
    сконвертирован LibreOffice): «Курсовая работа», «по дисциплине «{{DISCIPLINE}}»»,
    «на тему «{{TOPIC}}»» — кавычки-«ёлочки» зашиты в шаблон, значения указывать
    без кавычек. Децимальный номер — целой строкой {{DECIMAL_NUMBER}} в формате
    ПГУ.<код специальности>.<дисциплина>.КР.<номер зачётки>.<код документа>.ПЗ
    (например ПГУ.100503.С1118.КР.123456.01.ПЗ); блок «Специальность – 10.05.03 …»
    и «Специализация – 6 …» статичен. Реквизиты (Выполнил студент/Группа/
    Руководитель) — абзацы с отступом 3402 twips, «к.т.н., доцент» зашито в бланк
    статично (teacher_title доступен как плейсхолдер, но на форме не выведен).
    Тема и дисциплина переносятся на 2 строки — это норма бланка. Бланк кончается
    выше нижнего поля, поэтому в конце титула стоит явный page break.
